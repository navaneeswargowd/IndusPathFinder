# ----------------------------------------
# APPLICATION
# ----------------------------------------
spring.application.name=IndusPathFinder

#server.port=8081
server.address=0.0.0.0
server.port=${SERVERPORT}




#============================   gmail  =========================


spring.mail.host=smtp.gmail.com
spring.mail.port=587
#spring.mail.username=ranjeethyd04@gmail.com
#spring.mail.password=bjrhoxwuxjpkdweg
spring.mail.username=${EMAIL}
spring.mail.password=${EMAIL_PASS}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

#==================================  Jwt ===============================

#jwt.secret=IndusPathFinderJwtSecretKey123456789123456789123456
jwt.secret=${JWT_SECRET}
#jwt.expiration=86400000
jwt.expiration=${JWT_EXP}

# ----------------------------------------
# DATABASE
# ----------------------------------------
#spring.datasource.url=jdbc:mysql://localhost:3306/indus_path_finder
#spring.datasource.username=root
#spring.datasource.password=123456
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# JPA
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----------------------------------------
# JACKSON
# ----------------------------------------
spring.jackson.default-property-inclusion=non_null

# ----------------------------------------
# FILE UPLOAD
# ----------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ----------------------------------------
# LOG4J2
# ----------------------------------------
logging.config=classpath:log4j2.xml
